export:
  template: |
    * Generated
    {% for note in notes %}
    {% for page in note.pages %}
    {% if page.titles.0.analysis.name %}
    ** {{ page.titles.0.analysis.name }}
    {% else %}
    ** Page {{ page.number }}
    {% endif %}
    :PROPERTIES:
    :SNORG_PAGEID: {{ page.page_id }}
    :SNORG_SVGP: {{ page.svg }}
    {% if page.starred %}
    :STARRED: t
    {% endif %}
    :END:
    [[snorg:{{ page.page_id }}][page {{ page.number }}]]

    {% if page.analysis.content %}
    {{ page.analysis.content|org|nestorgheadings:2 }}

    {% endif %}
    {% if page.links %}
    *** Links
    {% for link in page.links %}
    {% if link.target_page_id %}
    - [[snorg-note:{{ link.target_page_id }}][{{ link.analysis.name|default:link.name|cut:".note" }}]]
    {% elif link.target_file_id %}
    - [[snorg-note:{{ link.target_file_id }}][{{ link.analysis.name|default:link.name|cut:".note" }}]]
    {% elif link.kind == "web" %}
    - [[{{ link.target }}][{{ link.analysis.name|default:link.name }}]]
    {% else %}
    - {{ link.analysis.name|default:link.name }} ({{ link.kind }}: {{ link.target }})
    {% endif %}
    {% endfor %}

    {% endif %}
    {% endfor %}
    {% endfor %}
